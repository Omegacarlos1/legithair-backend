openapi: 3.1.0
info: { title: Legit Hair Backend, version: 0.1.0 }
servers: [{ url: 'http://127.0.0.1:3000' }]
paths:
  /health:
    get:
      summary: Process liveness
      responses:
        '200': { description: Process is healthy }
  /ready:
    get:
      summary: Dependency readiness
      responses:
        '200': { description: MariaDB is available }
        '503': { description: MariaDB is unavailable }
  /api/v1/auth/register:
    post:
      summary: Register a customer and queue verification email
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Register' } } } }
      responses: { '201': { description: Registered }, '400': { description: Invalid input }, '409': { description: Email already registered } }
  /api/v1/auth/verify-email:
    post:
      summary: Consume a single-use email verification token
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Token' } } } }
      responses: { '200': { description: Verified }, '400': { description: Invalid, used, or expired token } }
  /api/v1/auth/resend-verification:
    post:
      summary: Queue a replacement verification message without revealing account state
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EmailRequest' } } } }
      responses: { '202': { description: Request accepted }, '400': { description: Invalid input }, '429': { description: Rate limited } }
  /api/v1/auth/login:
    post:
      summary: Authenticate and issue opaque bearer and refresh tokens
      responses: { '200': { description: Authenticated }, '401': { description: Invalid credentials }, '403': { description: Email not verified } }
  /api/v1/auth/refresh:
    post:
      summary: Rotate refresh token
      responses: { '200': { description: Rotated }, '401': { description: Invalid, expired, or reused token } }
  /api/v1/auth/logout:
    post:
      security: [{ bearerAuth: [] }]
      summary: Revoke presented access token
      responses: { '204': { description: Logged out }, '401': { description: Unauthenticated } }
  /api/v1/auth/forgot-password:
    post:
      summary: Queue reset instructions without revealing account existence
      responses: { '202': { description: Request accepted } }
  /api/v1/auth/reset-password:
    post:
      summary: Consume reset token, update password, and revoke sessions
      responses: { '200': { description: Password reset }, '400': { description: Invalid, used, or expired token } }
  /api/v1/me:
    get:
      security: [{ bearerAuth: [] }]
      summary: Current customer profile and roles
      responses: { '200': { description: Profile }, '401': { description: Unauthenticated } }
  /api/v1/me/addresses:
    get:
      security: [{ bearerAuth: [] }]
      summary: List current customer's addresses
      responses: { '200': { description: Address list } }
    post:
      security: [{ bearerAuth: [] }]
      summary: Create current customer's address
      responses: { '201': { description: Address created }, '400': { description: Invalid input } }
  /api/v1/sellers:
    post:
      security: [{ bearerAuth: [] }]
      summary: Create the current user's seller profile
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateSeller' } } } }
      responses: { '201': { description: Seller created }, '400': { description: Invalid input }, '401': { description: Unauthenticated }, '409': { description: Seller already exists } }
  /api/v1/sellers/me:
    get:
      security: [{ bearerAuth: [] }]
      summary: Get the current user's seller profile
      responses: { '200': { description: Seller profile }, '401': { description: Unauthenticated }, '404': { description: Seller not found } }
  /api/v1/sellers/me/verification:
    post:
      security: [{ bearerAuth: [] }]
      summary: Reserved identity-verification start route; provider currently deferred
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false } } } }
      responses: { '403': { description: Seller suspended }, '404': { description: Seller not found }, '503': { description: Identity provider not configured } }
  /api/v1/admin/sellers/{sellerId}/status:
    patch:
      security: [{ bearerAuth: [] }]
      summary: Record an admin seller approval-state decision
      parameters: [{ name: sellerId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SellerStatusDecision' } } } }
      responses: { '200': { description: Status updated or already current }, '400': { description: Invalid input }, '403': { description: Admin role required or self-decision forbidden }, '404': { description: Seller not found }, '409': { description: Verified identity required for approval } }
  /api/v1/categories:
    get:
      summary: List active catalogue categories
      responses: { '200': { description: Stable alphabetical category list } }
  /api/v1/products:
    get:
      summary: Browse published products
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: categoryId, in: query, schema: { type: string, format: uuid } }
        - { name: minPriceMinor, in: query, schema: { type: integer, minimum: 0 } }
        - { name: maxPriceMinor, in: query, schema: { type: integer, minimum: 0 } }
        - { name: brand, in: query, schema: { type: string, maxLength: 100 } }
        - { name: colour, in: query, schema: { type: string, maxLength: 100 } }
        - { name: size, in: query, schema: { type: string, maxLength: 100 } }
        - { name: sort, in: query, schema: { type: string, enum: [newest, price_asc, price_desc, popularity], default: newest } }
      responses: { '200': { description: Published products with stable pagination }, '400': { description: Invalid filters or price range } }
  /api/v1/products/{productId}:
    get:
      summary: Get a published product and its image metadata
      parameters: [{ name: productId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Published product }, '404': { description: Product is absent, unpublished, or in an inactive category } }
  /api/v1/products/{productId}/related:
    get:
      summary: Get published products in the same category
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 20, default: 8 } }
      responses: { '200': { description: Related products ordered by paid units sold }, '404': { description: Source product not public } }
  /api/v1/products/{productId}/images/{imageId}:
    get:
      summary: Read a validated image for a published product
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: imageId, in: path, required: true, schema: { type: string, format: uuid } }
      responses: { '200': { description: JPEG, PNG, or WebP bytes }, '404': { description: Image or published product not found } }
  /api/v1/admin/categories:
    post:
      security: [{ bearerAuth: [] }]
      summary: Create a category
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateCategory' } } } }
      responses: { '201': { description: Category created }, '403': { description: Admin role required }, '409': { description: Category already exists } }
  /api/v1/admin/categories/{categoryId}:
    patch:
      security: [{ bearerAuth: [] }]
      summary: Rename or activate/deactivate a category
      parameters: [{ name: categoryId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateCategory' } } } }
      responses: { '200': { description: Category updated }, '403': { description: Admin role required }, '404': { description: Category not found } }
  /api/v1/seller/products:
    get:
      security: [{ bearerAuth: [] }]
      summary: List the approved seller's own products, including drafts
      responses: { '200': { description: Own products }, '403': { description: Seller is not verified and approved, or is suspended } }
    post:
      security: [{ bearerAuth: [] }]
      summary: Create a seller-owned draft product
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateProduct' } } } }
      responses: { '201': { description: Draft product created }, '400': { description: Invalid input }, '403': { description: Verified and approved seller required }, '409': { description: Category unavailable } }
  /api/v1/seller/products/{productId}:
    patch:
      security: [{ bearerAuth: [] }]
      summary: Edit the approved seller's own product metadata
      parameters: [{ name: productId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateProduct' } } } }
      responses: { '200': { description: Product updated }, '403': { description: Seller unavailable or product owned by another seller }, '404': { description: Product not found } }
  /api/v1/seller/products/{productId}/publication:
    patch:
      security: [{ bearerAuth: [] }]
      summary: Publish or unpublish the seller's own product
      parameters: [{ name: productId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PublicationDecision' } } } }
      responses: { '200': { description: Publication status updated }, '403': { description: Verified and approved seller required }, '409': { description: Validated product image required } }
  /api/v1/seller/products/{productId}/stock:
    patch:
      security: [{ bearerAuth: [] }]
      summary: Apply an idempotent stock delta to the seller's own product
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 128 } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StockAdjustment' } } } }
      responses: { '200': { description: Applied or safely replayed }, '400': { description: Invalid or missing idempotency key }, '403': { description: Seller unavailable or cross-seller operation }, '409': { description: Insufficient stock or stock limit exceeded } }
  /api/v1/seller/products/{productId}/images:
    post:
      security: [{ bearerAuth: [] }]
      summary: Upload one validated product image
      parameters: [{ name: productId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image, altText]
              additionalProperties: false
              properties:
                image: { type: string, format: binary, description: JPEG, PNG, or WebP; configured maximum defaults to 5 MiB. }
                altText: { type: string, minLength: 2, maxLength: 200 }
                sortOrder: { type: integer, minimum: 0, maximum: 1000, default: 0 }
      responses: { '201': { description: Image validated and stored }, '400': { description: Missing or invalid multipart data }, '403': { description: Seller unavailable or cross-seller operation }, '413': { description: Image too large }, '415': { description: Declared or detected image type unsupported } }
  /api/v1/admin/products/{productId}:
    patch:
      security: [{ bearerAuth: [] }]
      summary: Edit any seller-owned product metadata
      parameters: [{ name: productId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateProduct' } } } }
      responses: { '200': { description: Product updated }, '403': { description: Admin role required }, '404': { description: Product not found } }
  /api/v1/admin/products/{productId}/publication:
    patch:
      security: [{ bearerAuth: [] }]
      summary: Publish or unpublish any seller-owned product without bypassing seller eligibility
      parameters: [{ name: productId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PublicationDecision' } } } }
      responses: { '200': { description: Publication status updated }, '403': { description: Admin required or owning seller not verified and approved }, '409': { description: Validated image required } }
  /api/v1/admin/products/{productId}/stock:
    patch:
      security: [{ bearerAuth: [] }]
      summary: Apply an audited idempotent stock delta to any product
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 128 } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StockAdjustment' } } } }
      responses: { '200': { description: Applied or safely replayed }, '403': { description: Admin role required }, '409': { description: Stock invariant violated } }
  /api/v1/baskets/guest:
    post:
      summary: Create an expiring guest basket and return its raw credential once
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false } } } }
      responses: { '201': { description: Guest basket created }, '429': { description: Rate limited } }
  /api/v1/baskets/current:
    get:
      security: [{ bearerAuth: [] }, { guestBasketAuth: [] }]
      summary: Read the current isolated customer or guest basket
      responses: { '200': { description: Basket with observed/current prices and availability }, '401': { description: Missing, invalid, or expired credential } }
  /api/v1/baskets/items:
    post:
      security: [{ bearerAuth: [] }, { guestBasketAuth: [] }]
      summary: Set the absolute quantity of one published product
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SetBasketItem' } } } }
      responses: { '201': { description: Basket item set }, '401': { description: Basket credential required }, '409': { description: Product unavailable, stock insufficient, or basket limit reached } }
  /api/v1/baskets/items/{productId}:
    delete:
      security: [{ bearerAuth: [] }, { guestBasketAuth: [] }]
      summary: Remove one product from the current basket
      parameters: [{ name: productId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '204': { description: Removed }, '404': { description: Basket item not found } }
  /api/v1/baskets/refresh:
    post:
      security: [{ bearerAuth: [] }, { guestBasketAuth: [] }]
      summary: Explicitly accept current prices after availability checks
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false } } } }
      responses: { '200': { description: Prices refreshed }, '409': { description: One or more products unavailable } }
  /api/v1/baskets/merge:
    post:
      security: [{ bearerAuth: [], guestBasketAuth: [] }]
      summary: Merge a guest basket into the authenticated customer basket exactly once
      responses: { '200': { description: Merged or safely replayed }, '409': { description: Quantity, line, stock, or prior-owner conflict } }
  /api/v1/delivery-options:
    get:
      summary: List active Lagos delivery zones and pickup locations
      responses: { '200': { description: Active options with NGN minor-unit fees and estimates } }
  /api/v1/admin/delivery-zones/{zoneId}:
    patch:
      security: [{ bearerAuth: [] }]
      summary: Update an admin-managed Lagos delivery zone
      parameters: [{ name: zoneId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateDeliveryZone' } } } }
      responses: { '200': { description: Zone updated }, '403': { description: Admin role required }, '404': { description: Zone not found } }
  /api/v1/admin/delivery-zones:
    post:
      security: [{ bearerAuth: [] }]
      summary: Create an admin-managed Lagos delivery zone
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateDeliveryZone' } } } }
      responses: { '201': { description: Zone created }, '403': { description: Admin role required }, '409': { description: Zone code already exists } }
  /api/v1/admin/pickup-locations:
    post:
      security: [{ bearerAuth: [] }]
      summary: Create an admin-managed Lagos pickup location
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreatePickupLocation' } } } }
      responses: { '201': { description: Pickup location created }, '400': { description: Invalid or non-Lagos location }, '403': { description: Admin role required } }
  /api/v1/admin/pickup-locations/{pickupLocationId}:
    patch:
      security: [{ bearerAuth: [] }]
      summary: Update or deactivate an admin-managed pickup location
      parameters: [{ name: pickupLocationId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdatePickupLocation' } } } }
      responses: { '200': { description: Pickup location updated }, '400': { description: Invalid or non-Lagos location }, '403': { description: Admin role required }, '404': { description: Pickup location not found } }
  /api/v1/admin/exchange-rates/usd:
    put:
      security: [{ bearerAuth: [] }]
      summary: Set the indicative USD rate used for display only
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [ngnMinorPerUsdMinor], additionalProperties: false, properties: { ngnMinorPerUsdMinor: { type: integer, minimum: 1 } } } } } }
      responses: { '200': { description: Rate and timestamp updated }, '403': { description: Admin role required } }
  /api/v1/checkout/quotes:
    post:
      security: [{ bearerAuth: [] }, { guestBasketAuth: [] }]
      summary: Create an immutable expiring NGN quote with per-seller delivery allocation
      parameters: [{ name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 128 } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CheckoutQuoteInput' } } } }
      responses: { '201': { description: Quote created }, '200': { description: Idempotent replay }, '400': { description: Invalid request or idempotency key }, '409': { description: Stale price, unavailable product, unsupported address, or key conflict } }
  /api/v1/checkout/quotes/{quoteId}:
    get:
      security: [{ bearerAuth: [] }, { guestBasketAuth: [] }]
      summary: Read an unexpired quote owned by the current basket
      parameters: [{ name: quoteId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Immutable quote snapshot }, '404': { description: Quote not found or not owned }, '410': { description: Quote expired } }
  /api/v1/orders:
    post:
      security: [{ bearerAuth: [] }, { guestBasketAuth: [] }]
      summary: Atomically create one order and reserve quoted inventory
      parameters: [{ name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 128 } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateOrder' } } } }
      responses: { '201': { description: Order and reservations created }, '200': { description: Identical idempotent replay }, '401': { description: Owner credential required }, '404': { description: Quote not found or not owned }, '409': { description: Changed replay, unavailable stock, used quote, or unavailable COD }, '410': { description: Quote expired }, '503': { description: Order policy or guest credential generation not configured } }
  /api/v1/orders/{orderId}:
    get:
      security: [{ bearerAuth: [] }, { orderTrackingAuth: [] }]
      summary: Read an order owned by the customer or guest tracking credential
      parameters: [{ name: orderId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Order, seller suborders, immutable item snapshots, and reservations }, '401': { description: Access credential required }, '404': { description: Order absent or inaccessible } }
  /api/v1/payments/initialize:
    post:
      security: [{ bearerAuth: [] }, { orderTrackingAuth: [] }]
      summary: Persist and initialize the owned order's server-controlled Paystack NGN payment
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InitializePayment' } } } }
      responses: { '201': { description: Payment attempt persisted and initialized }, '200': { description: Existing attempt returned }, '400': { description: Guest email required or input invalid }, '401': { description: Access credential required }, '404': { description: Order absent or inaccessible }, '409': { description: Order not payable, reservation expired, or email changed }, '503': { description: Paystack unconfigured or temporarily unavailable } }
  /api/v1/payments/verify:
    post:
      security: [{ bearerAuth: [] }, { orderTrackingAuth: [] }]
      summary: Verify the persisted order reference with Paystack and settle only exact matches
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/VerifyPayment' } } } }
      responses: { '200': { description: Provider result reconciled, including pending or idempotent success }, '401': { description: Access credential required }, '404': { description: Order/payment absent or inaccessible }, '409': { description: Supplied reference or verified provider fields mismatch }, '503': { description: Paystack temporarily unavailable } }
  /api/v1/payments/webhooks/paystack:
    post:
      summary: Receive raw-body HMAC SHA-512 authenticated Paystack events
      parameters: [{ name: X-Paystack-Signature, in: header, required: true, schema: { type: string, pattern: '^[A-Fa-f0-9]{128}$' } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [event, data] } } } }
      responses: { '200': { description: Authenticated event processed, ignored, rejected, or deduplicated }, '401': { description: Forged or missing signature } }
  /api/v1/orders/{orderId}/receipt:
    get:
      security: [{ bearerAuth: [] }, { orderTrackingAuth: [] }]
      summary: Download the immutable JSON receipt for a timely verified payment
      parameters: [{ name: orderId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: JSON receipt with Content-Disposition attachment }, '401': { description: Access credential required }, '404': { description: Receipt absent or inaccessible } }
  /api/v1/seller/orders/{orderId}/status:
    patch:
      security: [{ bearerAuth: [] }]
      summary: Advance only the authenticated seller's portion through processing and dispatch or pickup readiness
      parameters: [{ name: orderId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [status], additionalProperties: false, properties: { status: { type: string, enum: [processing, shipped, ready_for_pickup] }, reason: { type: string, minLength: 3, maxLength: 500 } } } } } }
      responses: { '200': { description: Seller portion advanced and aggregate progress returned }, '401': { description: Authentication required }, '403': { description: Seller role required }, '404': { description: No portion owned by this seller }, '409': { description: Invalid transition or delivery-method mismatch } }
  /api/v1/admin/orders/{orderId}/suborders/{suborderId}/status:
    patch:
      security: [{ bearerAuth: [] }]
      summary: Record authorised delivery, pickup, or eligible COD cancellation progress
      parameters: [{ name: orderId, in: path, required: true, schema: { type: string, format: uuid } }, { name: suborderId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [status], additionalProperties: false, properties: { status: { type: string, enum: [processing, shipped, ready_for_pickup, delivered, picked_up, cancelled] }, reason: { type: string, minLength: 3, maxLength: 500 } } } } } }
      responses: { '200': { description: Fulfilment progress updated }, '403': { description: Admin role required }, '404': { description: Order or suborder not found }, '409': { description: Invalid jump, delivery-method mismatch, or paid cancellation requiring refund } }
  /api/v1/orders/{orderId}/fulfilment:
    get:
      security: [{ bearerAuth: [] }, { orderTrackingAuth: [] }]
      summary: Read owned seller-level progress, snapshotted Lagos estimate or pickup details, and COD collection eligibility
      parameters: [{ name: orderId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Fulfilment progress }, '401': { description: Access credential required }, '404': { description: Order absent or inaccessible } }
  /api/v1/orders/{orderId}/cancel:
    post:
      security: [{ bearerAuth: [] }, { orderTrackingAuth: [] }]
      summary: Cancel an owned unprocessed unpaid or COD order and release stock once
      parameters: [{ name: orderId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], additionalProperties: false, properties: { reason: { type: string, minLength: 3, maxLength: 500 } } } } } }
      responses: { '200': { description: Order cancelled or idempotently returned }, '404': { description: Order absent or inaccessible }, '409': { description: Fulfilment started or paid order requires return workflow } }
  /api/v1/orders/{orderId}/returns:
    post:
      security: [{ bearerAuth: [] }, { orderTrackingAuth: [] }]
      summary: Submit an idempotent item-level return request within the configured window
      parameters: [{ name: orderId, in: path, required: true, schema: { type: string, format: uuid } }, { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 128 } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateReturn' } } } }
      responses: { '201': { description: Return request created }, '200': { description: Identical idempotent replay }, '404': { description: Order or item absent or inaccessible }, '409': { description: Invalid state, closed window, quantity exceeded, or changed replay }, '503': { description: Return window not configured } }
    get:
      security: [{ bearerAuth: [] }, { orderTrackingAuth: [] }]
      summary: List return and refund outcomes for the owned order
      parameters: [{ name: orderId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Return requests and refund states }, '404': { description: Order absent or inaccessible } }
  /api/v1/admin/returns/{returnRequestId}:
    patch:
      security: [{ bearerAuth: [] }]
      summary: Reject a return or approve its exact bounded Paystack refund
      parameters: [{ name: returnRequestId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReviewReturn' } } } }
      responses: { '200': { description: Review recorded and any provider refund initiated once }, '403': { description: Admin role required }, '409': { description: Already reviewed, COD policy unresolved, or provider rejection }, '503': { description: Refund policy/provider unconfigured or temporarily unavailable } }
  /api/v1/admin/refunds/{refundId}/reconcile:
    post:
      security: [{ bearerAuth: [] }]
      summary: Fetch the original provider refund and reconcile a delayed result
      parameters: [{ name: refundId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false } } } }
      responses: { '200': { description: Current refund state reconciled }, '409': { description: No provider identifier; manual review required }, '503': { description: Provider unavailable } }
  /api/v1/admin/payment-review-cases/{caseId}/refund:
    post:
      security: [{ bearerAuth: [] }]
      summary: Initiate one controlled full refund for a recorded late payment
      parameters: [{ name: caseId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false } } } }
      responses: { '202': { description: Late-payment refund persisted and initiated or safely replayed }, '404': { description: Late-payment case not found }, '503': { description: Provider unconfigured or unavailable } }
  /api/v1/admin/orders/{orderId}/cod-collection:
    post:
      security: [{ bearerAuth: [] }]
      summary: Record exact cash collection for a delivered COD order without making earnings eligible
      parameters: [{ name: orderId, in: path, required: true, schema: { type: string, format: uuid } }, { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 128 } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RecordCodCollection' } } } }
      responses: { '201': { description: Collection recorded }, '200': { description: Identical replay }, '409': { description: Not delivered, amount mismatch, or conflicting record } }
  /api/v1/admin/cod-collections/{collectionId}:
    patch:
      security: [{ bearerAuth: [] }]
      summary: Confirm or reject recorded cash collection; only confirmation marks future earnings eligible
      parameters: [{ name: collectionId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [action, note], additionalProperties: false, properties: { action: { type: string, enum: [confirm, reject] }, note: { type: string, minLength: 3, maxLength: 500 } } } } } }
      responses: { '200': { description: Collection reconciled }, '404': { description: Collection not found }, '409': { description: Collection already reconciled } }
  /api/v1/seller/earnings:
    get:
      security: [{ bearerAuth: [] }]
      summary: Read the authenticated seller's held, available, reserved, paid, and recoverable NGN balances
      responses: { '200': { description: Append-only ledger balances }, '401': { description: Unauthenticated }, '403': { description: Seller role required } }
  /api/v1/admin/sellers/{sellerId}/payout-recipient:
    put:
      security: [{ bearerAuth: [] }]
      summary: Bind a previously verified Paystack recipient code to a seller
      parameters: [{ in: path, name: sellerId, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Recipient configured with masked account metadata }, '403': { description: Finance role required } }
  /api/v1/admin/payouts:
    post:
      security: [{ bearerAuth: [] }]
      summary: Reserve available earnings and initiate one NGN Paystack transfer
      parameters: [{ in: header, name: Idempotency-Key, required: true, schema: { type: string, minLength: 8, maxLength: 128 } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [sellerId, amountMinor], additionalProperties: false, properties: { sellerId: { type: string, format: uuid }, amountMinor: { type: integer, minimum: 1 } } } } } }
      responses: { '202': { description: Payout persisted and provider initiation attempted }, '200': { description: Idempotent replay }, '403': { description: Finance role required }, '409': { description: Insufficient available earnings, recipient absent, or key reused }, '503': { description: Payout policy disabled } }
  /api/v1/admin/payouts/{payoutId}:
    get:
      security: [{ bearerAuth: [] }]
      summary: Read a payout and its provider reconciliation state
      parameters: [{ in: path, name: payoutId, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Payout state }, '403': { description: Finance role required }, '404': { description: Payout not found } }
  /api/v1/admin/payouts/{payoutId}/reconcile:
    post:
      security: [{ bearerAuth: [] }]
      summary: Verify an uncertain or pending transfer by its original provider reference
      responses: { '200': { description: Reconciled or still pending }, '403': { description: Finance role required } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
    guestBasketAuth: { type: apiKey, in: header, name: X-Guest-Basket-Token }
    orderTrackingAuth: { type: apiKey, in: header, name: X-Order-Tracking-Token }
  schemas:
    InitializePayment:
      type: object
      required: [orderId]
      additionalProperties: false
      properties:
        orderId: { type: string, format: uuid }
        email: { type: string, format: email, description: Required only for a guest order's first initialization. }
    VerifyPayment:
      type: object
      required: [orderId, reference]
      additionalProperties: false
      properties:
        orderId: { type: string, format: uuid }
        reference: { type: string, minLength: 3, maxLength: 100, pattern: '^[A-Za-z0-9.=-]+$' }
    CreateReturn:
      type: object
      required: [items, reason]
      additionalProperties: false
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          items: { type: object, required: [orderItemId, quantity], additionalProperties: false, properties: { orderItemId: { type: string, format: uuid }, quantity: { type: integer, minimum: 1, maximum: 20 } } }
        reason: { type: string, minLength: 3, maxLength: 500 }
    ReviewReturn:
      oneOf:
        - { type: object, required: [action, adminNote, stockDisposition], additionalProperties: false, properties: { action: { type: string, enum: [approve] }, adminNote: { type: string, minLength: 3, maxLength: 500 }, stockDisposition: { type: string, enum: [restock, no_restock] } } }
        - { type: object, required: [action, adminNote], additionalProperties: false, properties: { action: { type: string, enum: [reject] }, adminNote: { type: string, minLength: 3, maxLength: 500 } } }
    RecordCodCollection:
      type: object
      required: [amountMinor, collectionReference, collectedAt]
      additionalProperties: false
      properties:
        amountMinor: { type: integer, minimum: 0 }
        collectionReference: { type: string, minLength: 3, maxLength: 190, pattern: '^[A-Za-z0-9._:/-]+$' }
        collectedAt: { type: string, format: date-time }
    Register:
      type: object
      required: [email, password, displayName]
      additionalProperties: false
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 12, description: Must include lowercase, uppercase, and a digit. }
        displayName: { type: string, minLength: 2, maxLength: 100 }
    EmailRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email: { type: string, format: email }
    Token:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token: { type: string, minLength: 32, maxLength: 200 }
    CreateSeller:
      type: object
      required: [businessName, phone]
      additionalProperties: false
      properties:
        businessName: { type: string, minLength: 2, maxLength: 150 }
        phone: { type: string, minLength: 7, maxLength: 30 }
    SellerStatusDecision:
      type: object
      required: [status, reason]
      additionalProperties: false
      properties:
        status: { type: string, enum: [pending, approved, suspended] }
        reason: { type: string, minLength: 3, maxLength: 500 }
    CreateCategory:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
    UpdateCategory:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        isActive: { type: boolean }
    CreateProduct:
      type: object
      required: [categoryId, name, description, priceMinor]
      additionalProperties: false
      properties:
        categoryId: { type: string, format: uuid }
        name: { type: string, minLength: 2, maxLength: 180 }
        description: { type: string, minLength: 10, maxLength: 10000 }
        priceMinor: { type: integer, minimum: 0, maximum: 9000000000000, description: NGN minor units. }
        brand: { type: [string, 'null'], maxLength: 100 }
        colour: { type: [string, 'null'], maxLength: 100, description: Descriptive metadata, not a selectable variant. }
        size: { type: [string, 'null'], maxLength: 100, description: Descriptive metadata, not a selectable variant. }
        lowStockThreshold: { type: integer, minimum: 0, maximum: 2000000000, default: 0 }
        initialStock: { type: integer, minimum: 0, maximum: 2000000000, default: 0 }
    UpdateProduct:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        categoryId: { type: string, format: uuid }
        name: { type: string, minLength: 2, maxLength: 180 }
        description: { type: string, minLength: 10, maxLength: 10000 }
        priceMinor: { type: integer, minimum: 0, maximum: 9000000000000, description: NGN minor units. }
        brand: { type: [string, 'null'], maxLength: 100 }
        colour: { type: [string, 'null'], maxLength: 100 }
        size: { type: [string, 'null'], maxLength: 100 }
        lowStockThreshold: { type: integer, minimum: 0, maximum: 2000000000 }
    PublicationDecision:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: { type: string, enum: [published, unpublished] }
    StockAdjustment:
      type: object
      required: [delta, reason]
      additionalProperties: false
      properties:
        delta: { type: integer, minimum: -2000000000, maximum: 2000000000, not: { const: 0 } }
        reason: { type: string, minLength: 3, maxLength: 500 }
    SetBasketItem:
      type: object
      required: [productId, quantity]
      additionalProperties: false
      properties:
        productId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 20, description: Absolute desired quantity, not an increment. }
    UpdateDeliveryZone:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        coverage: { type: array, minItems: 1, maxItems: 100, items: { type: string, minLength: 2, maxLength: 100 } }
        feeMinor: { type: integer, minimum: 0, description: NGN minor units charged per distinct seller. }
        minBusinessDays: { type: integer, minimum: 0, maximum: 30 }
        maxBusinessDays: { type: integer, minimum: 0, maximum: 30 }
        isActive: { type: boolean }
    CreateDeliveryZone:
      type: object
      required: [code, name, coverage, feeMinor, minBusinessDays, maxBusinessDays]
      additionalProperties: false
      properties:
        code: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', maxLength: 50 }
        name: { type: string, minLength: 2, maxLength: 100 }
        coverage: { type: array, minItems: 1, maxItems: 100, items: { type: string, minLength: 2, maxLength: 100 } }
        feeMinor: { type: integer, minimum: 0 }
        minBusinessDays: { type: integer, minimum: 0, maximum: 30 }
        maxBusinessDays: { type: integer, minimum: 0, maximum: 30 }
        isActive: { type: boolean, default: true }
    CreatePickupLocation:
      type: object
      required: [name, addressLine, city, state, minBusinessDays, maxBusinessDays]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        addressLine: { type: string, minLength: 5, maxLength: 250 }
        city: { type: string, minLength: 2, maxLength: 100 }
        state: { type: string, minLength: 2, maxLength: 100, description: Must be Lagos. }
        feeMinor: { type: integer, minimum: 0, default: 0 }
        minBusinessDays: { type: integer, minimum: 0, maximum: 30 }
        maxBusinessDays: { type: integer, minimum: 0, maximum: 30 }
        isActive: { type: boolean, default: false }
    UpdatePickupLocation:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        addressLine: { type: string, minLength: 5, maxLength: 250 }
        city: { type: string, minLength: 2, maxLength: 100 }
        state: { type: string, minLength: 2, maxLength: 100, description: Must be Lagos. }
        feeMinor: { type: integer, minimum: 0 }
        minBusinessDays: { type: integer, minimum: 0, maximum: 30 }
        maxBusinessDays: { type: integer, minimum: 0, maximum: 30 }
        isActive: { type: boolean }
    GuestDeliveryAddress:
      type: object
      required: [recipientName, phone, line1, city, state, countryCode]
      additionalProperties: false
      properties:
        recipientName: { type: string, minLength: 2, maxLength: 100 }
        phone: { type: string, minLength: 7, maxLength: 30 }
        line1: { type: string, minLength: 3, maxLength: 200 }
        line2: { type: string, minLength: 1, maxLength: 200 }
        city: { type: string, minLength: 2, maxLength: 100 }
        state: { type: string, minLength: 2, maxLength: 100 }
        countryCode: { type: string, minLength: 2, maxLength: 2, default: NG }
    CheckoutQuoteInput:
      oneOf:
        - type: object
          required: [deliveryMethod, zoneId]
          additionalProperties: false
          properties:
            deliveryMethod: { const: delivery }
            zoneId: { type: string, format: uuid }
            addressId: { type: string, format: uuid, description: Required for authenticated customers. }
            address: { $ref: '#/components/schemas/GuestDeliveryAddress' }
        - type: object
          required: [deliveryMethod, pickupLocationId]
          additionalProperties: false
          properties:
            deliveryMethod: { const: pickup }
            pickupLocationId: { type: string, format: uuid }
    CreateOrder:
      type: object
      required: [quoteId, paymentMethod]
      additionalProperties: false
      properties:
        quoteId: { type: string, format: uuid }
        paymentMethod: { type: string, enum: [paystack, cod] }
